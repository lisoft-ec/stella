<html>
  <head>
    <title>SILTTEC Contador</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='imgs/stella_favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  </head>
  <body>
    <div>
      <h1>Contador de Personas</h1>
      <h2>Version: {{ defversion }}</h2>
      <img id="visor" class="imagen" src="{{ url_for('video_feed') }}">
    </div>
    <div class="login-box">
      <form method="POST">
        <div class="user-box">
          <input type="text" id="fcorte" name="fcorte" value="{{  defcorte  }}" >
          <label>Rect de Corte:</label>
        </div>
        <div class="user-box">
          <input type="text" id="fpiso" name="fpiso" value="{{  defpiso  }}" >
          <label>Rect de Piso:</label>
        </div>
        <div class="user-box">
          <input type="password" id="fpass" name="fpass" value="{{  defpass  }}" >
          <label>Contraseña:</label>
        </div>
        <label class="mensaje" id="fmsg" name="fmsg">{{  defmsg  }}</label>
        <input class="boton" type="submit" value="Aplicar">         
      </form>
    </div>
    <script>
      document.getElementById("visor").addEventListener('click', function (event) {    
          var x = event.pageX - this.offsetLeft;
          var y = event.pageY - this.offsetTop;
          
          alert("X Coordinate: " + x + " Y Coordinate: " + y);

      }); 
    </script>
    
  </body>
</html>
