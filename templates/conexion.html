<html>
  <head>
    <title>SILTTEC Contador</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='imgs/stella_favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  </head>
  <body>
    <div>
      <h1>Conexiones</h1>
      <h2>Version: {{ defversion }}</h2>      
    </div>
    <div class="login-box">
      <form method="POST">
        <div class="user-box">
          <input type="text" id="fssid" name="fssid" value="{{  defssid  }}" >
          <label>SSID:</label>
        </div>
        <div class="user-box">
          <input type="password" id="fpass" name="fpass" value="{{  defpass  }}" >
          <label>Rect de Piso:</label>
        </div>        
        <label class="mensaje" id="fmsg" name="fmsg">{{  defmsg  }}</label>
        <input class="boton" type="submit" value="Guardar">         
      </form>
    </div>   
    <div class="login-box">
      <a href="javascript:history.back()" class="button">Volver</a>
    </div>   
    
  </body>
</html>
