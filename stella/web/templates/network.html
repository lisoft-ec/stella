{% extends "base.html" %}
{% block title %}Red{% endblock %}
{% block content %}
<h2>Red</h2>
<div x-data="networkForm()">
  <article class="banner info" x-show="data && !data.managed">
    La gestión de red está desactivada: Stella no modifica NetworkManager (modo PC/desarrollo).
    <label><input type="checkbox" role="switch" :checked="data && data.managed" @change="data.managed = $event.target.checked"> Activar gestión de red</label>
  </article>

  <div class="grid-2">
    <article>
      <header><strong>Estado</strong> <button class="outline secondary small right" @click="loadStatus()">Actualizar</button></header>
      <template x-if="status">
        <div>
          <p x-show="!status.managed" class="muted small">Sin datos: la gestión de red está desactivada.</p>
          <p x-show="status.managed">
            <span class="dot" :class="status.connected ? 'ok' : 'bad'"></span>
            <span x-text="status.connected ? 'Conectado' : 'Sin conexión'"></span>
            <span class="badge" x-show="status.hotspot_active">Hotspot activo</span>
          </p>
          <table class="small">
            <thead><tr><th>Interfaz</th><th>Tipo</th><th>Estado</th><th>Conexión</th></tr></thead>
            <tbody>
              <template x-for="d in status.devices">
                <tr><td x-text="d.device"></td><td x-text="d.type"></td><td x-text="d.state"></td><td x-text="d.connection"></td></tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
      <p class="muted small" x-show="!status" x-text="statusError || 'Cargando…'"></p>
    </article>

    <article>
      <header><strong>Redes visibles</strong> <button class="outline secondary small right" @click="scan()" :aria-busy="scanning">Buscar</button></header>
      <ul class="scan">
        <template x-for="n in networks" :key="n.ssid">
          <li>
            <span x-text="n.ssid"></span>
            <small class="muted" x-text="n.signal + '% · ' + (n.security || 'abierta')"></small>
            <button class="outline small" @click="addWifi(n.ssid)">Añadir</button>
          </li>
        </template>
        <li class="muted small" x-show="!networks.length" x-text="scanning ? 'Buscando redes (unos segundos)…' : (scanCached ? 'No hay ninguna lista guardada todavía.' : 'Pulsa «Buscar» para ver las redes wifi cercanas.')"></li>
      </ul>
      <template x-if="scanCached">
        <div>
          <p class="small muted">Con el hotspot activo la placa no puede buscar redes: esta es la lista guardada<span x-show="scanTime" x-text="' a las ' + scanTime"></span>.</p>
          <button class="outline secondary small" @click="rescanThroughHotspot()">Buscar de nuevo (corta el hotspot ~20 s)</button>
        </div>
      </template>
    </article>
  </div>

  <template x-if="data">
    <div>
      <article>
        <header><strong>Redes wifi conocidas</strong></header>
        <p class="small muted">Stella se conecta a la red disponible con mayor prioridad.</p>
        <template x-for="(w, i) in data.wifi" :key="i">
          <div class="row">
            <input x-model="w.ssid" placeholder="Nombre de la red (SSID)">
            <input type="password" x-model="w.password" placeholder="Clave (vacía si es abierta)" autocomplete="new-password">
            <input type="number" x-model.number="w.priority" title="Prioridad" class="narrow">
            <label class="inline-check" title="Red oculta (no anuncia su nombre)"><input type="checkbox" x-model="w.hidden"> oculta</label>
            <button class="outline secondary small" @click="data.wifi.splice(i, 1)">✕</button>
          </div>
        </template>
        <p class="small muted" x-show="!data.wifi.length">Sin redes guardadas: añade una desde «Redes visibles» o como red oculta.</p>
        <button class="outline secondary small" @click="addWifi('')">Añadir red</button>
      </article>

      <article>
        <header><strong>Red oculta</strong></header>
        <p class="small muted">Para redes que no anuncian su nombre y por eso no aparecen al buscar. Escribe el nombre exacto (distingue mayúsculas).</p>
        <div class="grid">
          <label>Nombre de la red (SSID) <input x-model="hidden.ssid" autocomplete="off"></label>
          <label>Clave <input type="password" x-model="hidden.password" autocomplete="new-password" placeholder="vacía si es abierta"></label>
          <label>Prioridad <input type="number" x-model.number="hidden.priority"></label>
        </div>
        <button @click="addHidden()" :aria-busy="saving">Añadir y aplicar</button>
      </article>

      <div class="grid-2">
        <article>
          <header><strong>Hotspot de respaldo</strong></header>
          <label><input type="checkbox" role="switch" x-model="data.hotspot.enabled"> Crear un punto de acceso si no hay conexión</label>
          <div class="grid">
            <label>SSID <input x-model="data.hotspot.ssid"></label>
            <label>Clave <input type="text" x-model="data.hotspot.password" autocomplete="off" class="mono"></label>
          </div>
          <div class="grid">
            <label>Esperar antes de activarlo (s) <input type="number" min="15" x-model.number="data.hotspot.timeout"></label>
            <label>Reintentar redes conocidas cada (s) <input type="number" min="30" x-model.number="data.hotspot.retry_interval"></label>
          </div>
        </article>

        <article>
          <header><strong>Ethernet</strong></header>
          <label>Modo
            <select x-model="data.ethernet.method">
              <option value="auto">Automático (DHCP)</option>
              <option value="manual">IP fija</option>
            </select>
          </label>
          <template x-if="data.ethernet.method === 'manual'">
            <div>
              <label>Dirección (CIDR) <input x-model="data.ethernet.address" placeholder="192.168.0.30/24"></label>
              <label>Puerta de enlace <input x-model="data.ethernet.gateway" placeholder="192.168.0.1"></label>
              <label>DNS <input x-model="data.ethernet.dns" placeholder="8.8.8.8 1.1.1.1"></label>
            </div>
          </template>
        </article>
      </div>

      <div class="toolbar">
        <button @click="save()" :aria-busy="saving">Guardar y aplicar</button>
      </div>
    </div>
  </template>
</div>
{% endblock %}
